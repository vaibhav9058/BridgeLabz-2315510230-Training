<!DOCTYPE html>
<html>
<head>
    <title>Form Security Attributes</title>
</head>
<body>
    <form autocomplete="off">
        <input type="text" placeholder="Username" required><br>
        <input type="password" placeholder="Password" required><br>
        <input type="submit" value="Login">
    </form>
    <p>Note: Turning off autocomplete prevents browsers from storing credentials, enhancing security.</p>
</body>
</html>
