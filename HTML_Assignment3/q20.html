<!DOCTYPE html>
<html>
<head>
    <title>Complete Head Elements</title>
    <!-- Sets character encoding -->
    <meta charset="UTF-8">
    <!-- Describes the page -->
    <meta name="description" content="Example HTML head elements">
    <!-- Author of the page -->
    <meta name="author" content="Student Name">
    <!-- Base URL for all relative links -->
    <base href="https://example.com/">
    <!-- Link to favicon or stylesheet -->
    <link rel="icon" href="favicon.ico">
    <!-- Internal style section -->
    <style></style>
    <!-- Internal script section -->
    <script></script>
</head>
<body>
    <p>All essential &lt;head&gt; elements are included above.</p>
</body>
</html>
