<!-- form.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Form with Iframe</title>
</head>
<body>
    <form target="resultFrame" action="result.html">
        <input type="text" name="user_input" placeholder="Enter text">
        <input type="submit" value="Submit">
    </form>
    <iframe name="resultFrame" width="100%" height="100"></iframe>
</body>
</html>

<!-- result.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Result</title>
</head>
<body>
    <p>Form successfully submitted.</p>
</body>
</html>
