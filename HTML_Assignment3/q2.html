<!DOCTYPE html>
<html>
<head>
    <title>Embed Google Map</title>
</head>
<body>
    <!-- The loading attribute improves performance by deferring offscreen iframe loading until needed -->
    <iframe src="https://www.google.com/maps?q=Delhi&output=embed" title="Google Map" width="80%" height="60%" loading="lazy"></iframe>
</body>
</html>
