<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdown Selection Page</title>
</head>
<body>

    <!-- Header Section -->
    <header>
        <h1>Travel Selection Form</h1>
        <p>Select your preferred travel destinations below.</p>
    </header>

    <!-- Selection Form -->
    <main>
        <form>

            <!-- Country Dropdown -->
            <label for="country">Country:</label><br>
            <select id="country" name="country">
                <option value="india" selected>India</option>
                <option value="france">France</option>
                <option value="japan">Japan</option>
                <option value="spain">Spain</option>
            </select><br><br>

            <!-- State Dropdown -->
            <label for="state">State:</label><br>
            <select id="state" name="state">
                <option value="maharashtra" selected>Maharashtra</option>
                <option value="karnataka">Karnataka</option>
                <option value="delhi">Delhi</option>
                <option value="goa">Goa</option>
            </select><br><br>

            <!-- City Dropdown -->
            <label for="city">City:</label><br>
            <select id="city" name="city">
                <option value="mumbai" selected>Mumbai</option>
                <option value="bangalore">Bangalore</option>
                <option value="delhi">Delhi</option>
                <option value="pune">Pune</option>
            </select><br><br>

            <!-- Favorite Tourist Place Dropdown -->
            <label for="tourist">Favorite Tourist Place:</label><br>
            <select id="tourist" name="tourist">
                <option value="gateway" selected>Gateway of India</option>
                <option value="marina">Marina Beach</option>
                <option value="tajmahal">Taj Mahal</option>
                <option value="eiffel">Eiffel Tower</option>
            </select><br><br>

        </form>

        <!-- Summary Paragraph -->
        <p>Selected Destination: Country - <strong>India</strong>, State - <strong>Maharashtra</strong>, City - <strong>Mumbai</strong>, Favorite Place - <strong>Gateway of India</strong>.</p>
    </main>

    <!-- Footer Section -->
    <footer>
        <p>&copy; 2025 Travel Explorer. All Rights Reserved.</p>
    </footer>

</body>
</html>
